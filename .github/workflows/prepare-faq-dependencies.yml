name: Resolve FAQ dependencies
on:
  push:
    branches: [feature/interactive-growth-navigation]
    paths: [.github/workflows/prepare-faq-dependencies.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact dependency metadata
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact clsx@2.1.1 tailwind-merge@3.3.1
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact tw-animate-css@1.4.0
      - name: Store only immutable dependency blobs, without updating any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const blobs = {};
            for (const path of ['package.json', 'package-lock.json']) {
              const {data} = await github.rest.git.createBlob({owner: context.repo.owner, repo: context.repo.repo, encoding: 'base64', content: fs.readFileSync(path).toString('base64')});
              blobs[path] = data.sha;
            }
            fs.writeFileSync('faq-dependency-blobs.json', JSON.stringify(blobs, null, 2));
            core.info(JSON.stringify(blobs));
      - uses: actions/upload-artifact@v4
        with:
          name: faq-dependency-lock
          path: |
            package.json
            package-lock.json
            faq-dependency-blobs.json
          retention-days: 3
