name: Independent website deployment
on:
  push:
    branches: [main, codex/independent-cloudflare]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_MEASUREMENT_ENABLED: ${{ vars.NEXT_PUBLIC_MEASUREMENT_ENABLED }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      WD_LEGAL_NAME: ${{ vars.WD_LEGAL_NAME }}
      WD_CORRESPONDENCE_ADDRESS: ${{ vars.WD_CORRESPONDENCE_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture dependency security baseline
        run: |
          npm audit --json > npm-audit.json || true
          node qa/security-audit-report.cjs npm-audit.json
      - name: Upload dependency security baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.sha }}
          path: npm-audit.json
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Build current Cloudflare tooling candidate
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.devDependencies.miniflare = '5.20260916.0-alpha';
          pkg.devDependencies.wrangler = '4.133.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > npm-audit-cloudflare-candidate.json || true
          node qa/security-audit-report.cjs npm-audit-cloudflare-candidate.json
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-cloudflare-candidate.json','utf8'));
          const v = audit.metadata?.vulnerabilities || {};
          if ((v.critical || 0) > 0 || (v.high || 0) > 0) {
            console.error(`Cloudflare tooling candidate still has ${v.critical || 0} critical and ${v.high || 0} high vulnerabilities.`);
            process.exit(1);
          }
          console.log('Cloudflare tooling candidate gate passed: no critical/high vulnerabilities.');
          NODE
      - name: Upload Cloudflare tooling candidate
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-security-candidate-${{ github.sha }}
          path: |
            package.json
            package-lock.json
            npm-audit-cloudflare-candidate.json
          retention-days: 7
      - run: npm run test:workflow-docs
      - run: npm run test:workflow-profile
      - run: npm run test:browser-contract
      - run: npm run test:ci-workflow
      - run: npm run test:backend
      - run: npm run build
      - run: npm run test:mb-legacy
      - run: npm run typecheck
      - run: npm run test:measurement
      - run: npm run test:deployment
      - name: Install pinned browser QA tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Generate local Cloudflare preview configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CLOUDFLARE_D1_DATABASE_ID: 11111111-2222-4333-8444-555555555555
          DEPLOY_CUSTOM_DOMAINS: 'false'
          CONTACT_EMAIL_ENABLED: 'false'
        run: npm run configure:cloudflare
      - name: Start verified Cloudflare preview
        run: |
          npm run start -- --ip 127.0.0.1 --port 8787 > /tmp/wd-preview.log 2>&1 &
          echo $! > /tmp/wd-preview.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wd-preview.log
          exit 1
      - name: Run browser responsive and accessibility audit
        run: QA_BASE_URL=http://127.0.0.1:8787 npm run test:browser
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: qa-results/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site-${{ github.sha }}
          path: dist/
          retention-days: 7
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_CUSTOM_DOMAINS: ${{ vars.DEPLOY_CUSTOM_DOMAINS }}
      CONTACT_EMAIL_ENABLED: ${{ vars.CONTACT_EMAIL_ENABLED }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site-${{ github.sha }}
          path: dist/
      - name: Apply migrations and deploy the tested source
        run: npm run deploy
