name: Independent website deployment
on:
  push:
    branches: [main, codex/independent-cloudflare]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_MEASUREMENT_ENABLED: ${{ vars.NEXT_PUBLIC_MEASUREMENT_ENABLED }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_GA4_ID: ${{ vars.NEXT_PUBLIC_GA4_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      WD_LEGAL_NAME: ${{ vars.WD_LEGAL_NAME }}
      WD_CORRESPONDENCE_ADDRESS: ${{ vars.WD_CORRESPONDENCE_ADDRESS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:workflow-docs
      - run: npm run test:workflow-profile
      - run: npm run test:browser-contract
      - run: npm run test:ci-workflow
      - run: npm run test:backend
      - run: npm run build
      - run: npm run test:mb-legacy
      - run: npm run typecheck
      - run: npm run test:measurement
      - run: npm run test:deployment
      - name: Install pinned browser QA tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0 @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium
      - name: Start verified Cloudflare preview
        run: |
          npm run start -- --ip 127.0.0.1 --port 8787 > /tmp/wd-preview.log 2>&1 &
          echo $! > /tmp/wd-preview.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wd-preview.log
          exit 1
      - name: Run browser responsive and accessibility audit
        run: QA_BASE_URL=http://127.0.0.1:8787 npm run test:browser
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-${{ github.sha }}
          path: qa-results/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site-${{ github.sha }}
          path: dist/
          retention-days: 7
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_CUSTOM_DOMAINS: ${{ vars.DEPLOY_CUSTOM_DOMAINS }}
      CONTACT_EMAIL_ENABLED: ${{ vars.CONTACT_EMAIL_ENABLED }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site-${{ github.sha }}
          path: dist/
      - name: Apply migrations and deploy the tested source
        run: npm run deploy
