name: Temporary approved-article image review (remove before merge)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/temporary-replace-article-images.yml'
jobs:
  image-import:
    if: ${{ github.repository == 'waeldaas192/wd-marketing' && github.head_ref == 'visuals/higgsfield-insights-20261105' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install WebP conversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp file
      - name: Download and optimize replacement Higgsfield images
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_215320_43ca1a7b-6c01-4093-b201-2bdc85548e0e.png' -o /tmp/review-seo.png
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_215320_9f67cbae-a75a-407b-a3ff-54fad64aa46b.png' -o /tmp/review-google-ads.png
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_215320_c5e2d0ef-d76c-4fd6-a43c-74f7051fcc96.png' -o /tmp/review-local.png
          file /tmp/review-seo.png /tmp/review-google-ads.png /tmp/review-local.png
          cwebp -quiet -q 82 -m 6 -mt -resize 1600 900 /tmp/review-seo.png -o public/images/insights/seo-lead-generation-strategy.webp
          cwebp -quiet -q 82 -m 6 -mt -resize 1600 900 /tmp/review-google-ads.png -o public/images/insights/google-ads-landing-page-conversion.webp
          cwebp -quiet -q 82 -m 6 -mt -resize 1600 900 /tmp/review-local.png -o public/images/insights/local-service-growth-system.webp
          du -h public/images/insights/seo-lead-generation-strategy.webp public/images/insights/google-ads-landing-page-conversion.webp public/images/insights/local-service-growth-system.webp
      - name: Commit only replacement image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/insights/seo-lead-generation-strategy.webp public/images/insights/google-ads-landing-page-conversion.webp public/images/insights/local-service-growth-system.webp
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: replace rejected article covers with new editorial imagery'
            git push origin HEAD:${{ github.head_ref }}
          fi
