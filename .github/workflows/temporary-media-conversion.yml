name: Temporary Higgsfield image conversion (remove before merge)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/temporary-media-conversion.yml'
jobs:
  image-conversion:
    if: ${{ github.repository == 'waeldaas192/wd-marketing' && github.head_ref == 'visuals/higgsfield-insights-20261105' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp file
      - name: Fetch Higgsfield generated images and convert to optimized WebP
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_202519_8d06a881-02a1-4836-98a8-4d5fc626555c.png' -o /tmp/wd-seo.png
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_202518_0595433f-1256-4ab2-8484-e41339112ef1.png' -o /tmp/wd-ads.png
          curl --fail --location --silent --show-error --max-time 90 'https://d8j0ntlcm91z4.cloudfront.net/user_3GEucVxZY0sRqYaixUorECNXN6a/hf_20261105_202519_639321b4-21fa-481d-bb06-bb3f1bea50a1.png' -o /tmp/wd-local.png
          file /tmp/wd-seo.png /tmp/wd-ads.png /tmp/wd-local.png
          cwebp -quiet -q 80 -m 6 -mt -resize 1600 900 /tmp/wd-seo.png -o public/images/insights/seo-lead-generation-strategy.webp
          cwebp -quiet -q 80 -m 6 -mt -resize 1600 900 /tmp/wd-ads.png -o public/images/insights/google-ads-landing-page-conversion.webp
          cwebp -quiet -q 80 -m 6 -mt -resize 1600 900 /tmp/wd-local.png -o public/images/insights/local-service-growth-system.webp
          file public/images/insights/*.webp
          du -h public/images/insights/seo-lead-generation-strategy.webp public/images/insights/google-ads-landing-page-conversion.webp public/images/insights/local-service-growth-system.webp
      - name: Commit only three replaced image files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/insights/seo-lead-generation-strategy.webp public/images/insights/google-ads-landing-page-conversion.webp public/images/insights/local-service-growth-system.webp
          if ! git diff --cached --quiet; then
            git commit -m 'visuals: replace three insight placeholders with Higgsfield images'
            git push origin HEAD:${{ github.head_ref }}
          fi
