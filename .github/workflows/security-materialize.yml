name: Materialize tested security dependencies
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'security/production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Commit tested Cloudflare tool versions if missing
        run: |
          if node - <<'NODE'
          const p = require('./package.json');
          const d = p.devDependencies || {};
          process.exit(d['@cloudflare/workers-types'] === '5.20260916.1' && d.miniflare === '5.20260916.0-alpha' && d.wrangler === '4.133.0' ? 0 : 1);
          NODE
          then
            echo 'Cloudflare tool versions already committed.'
            exit 0
          fi
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.devDependencies['@cloudflare/workers-types'] = '5.20260916.1';
          pkg.devDependencies.miniflare = '5.20260916.0-alpha';
          pkg.devDependencies.wrangler = '4.133.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix: update Cloudflare development tooling'
          git push origin HEAD:${GITHUB_HEAD_REF}
