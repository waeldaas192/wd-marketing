name: Dependency security audit

on:
  push:
    branches:
      - security/dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile from candidate dependency policy
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Capture full npm audit report
        run: |
          npm audit --json > audit-full.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'));
          console.log('FULL_AUDIT');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: audit.vulnerabilities || {} }, null, 2));
          NODE
      - name: Capture production-only npm audit report
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('PRODUCTION_AUDIT');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: audit.vulnerabilities || {} }, null, 2));
          NODE
      - name: Verify candidate dependencies
        run: |
          npm run test:backend
          npm run build
          npm run typecheck
          npm run test:measurement
          npm run test:deployment
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-${{ github.sha }}
          path: |
            package-lock.json
            audit-full.json
            audit-prod.json
          retention-days: 7
