name: Dependency security audit

on:
  push:
    branches:
      - security/dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full npm audit report
        run: |
          npm audit --json > audit-full.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-full.json', 'utf8'));
          const vulnerabilities = Object.fromEntries(
            Object.entries(audit.vulnerabilities || {}).map(([name, value]) => [name, {
              severity: value.severity,
              isDirect: value.isDirect,
              via: value.via,
              effects: value.effects,
              range: value.range,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
            }])
          );
          console.log('FULL_AUDIT');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities }, null, 2));
          NODE
      - name: Capture production-only npm audit report
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-prod.json', 'utf8'));
          console.log('PRODUCTION_AUDIT');
          console.log(JSON.stringify({ metadata: audit.metadata, vulnerabilities: audit.vulnerabilities || {} }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            audit-full.json
            audit-prod.json
          retention-days: 7
